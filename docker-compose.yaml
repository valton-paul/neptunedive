version: '3'

services:
  front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neptunedive-front
    ports:
      - "5173:5173"
    networks:
      - shared_network
    volumes:
      - ./:/root/workspace
    command: >
      sh -c "
      npm install --legacy-peer-deps &&
      npm run dev
      "
      

networks:
  shared_network:
    external: true
